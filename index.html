<style>
/* ============================================================
   YiZhiQvQ — Editorial Light-Luxury Theme · 作品索引
   ============================================================ */
:root {
  --bg:        #fbfaf8;
  --bg-soft:   #f5f3ef;
  --ink:       #15171b;
  --ink-soft:  #3a3e45;
  --muted:     #787c84;
  --faint:     #a5a29b;
  --line:      #e5e1d9;
  --gold:      #9a7b4f;
  --gold-soft: #c9ae82;
  --white:     #ffffff;

  --serif: 'Cormorant Garamond', 'Noto Serif SC', 'Songti SC', serif;
  --sans:  'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  --shadow-sm: 0 1px 2px rgba(21,23,27,.04), 0 10px 28px -16px rgba(21,23,27,.14);
  --shadow-md: 0 2px 6px rgba(21,23,27,.04), 0 30px 60px -32px rgba(21,23,27,.22);

  --ease: cubic-bezier(.16, 1, .3, 1);
  --nav-h: 76px;
}

/* ===== Reset ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--sans);
  font-weight: 400;
  font-size: 1rem;
  line-height: 1.6;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  display: flex; flex-direction: column;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
img { max-width: 100%; }
a { color: inherit; }
main { flex: 1 0 auto; }

/* Warm ambient wash */
body::after {
  content: '';
  position: fixed; inset: 0;
  z-index: 0; pointer-events: none;
  background:
    radial-gradient(58% 38% at 8% -4%, rgba(154,123,79,.075), transparent 62%),
    radial-gradient(46% 34% at 102% 4%, rgba(27,75,143,.05), transparent 62%);
}

/* ===== Typography ===== */
h2, h3 { font-family: var(--serif); font-weight: 400; color: var(--ink); }
h2 {
  font-size: clamp(1.85rem, 3.4vw, 2.6rem);
  line-height: 1.3;
  letter-spacing: .02em;
}
h3 { font-size: 1.18rem; font-weight: 500; letter-spacing: .02em; }
.accent { color: var(--gold); }

.eyebrow {
  display: flex; align-items: center; gap: .85rem;
  font-family: var(--sans);
  font-size: .7rem; font-weight: 500;
  letter-spacing: .26em; text-transform: uppercase;
  color: var(--gold);
}
.eyebrow::before {
  content: ''; flex: 0 0 auto;
  width: 26px; height: 1px; background: var(--gold-soft);
}

/* ===== Layout ===== */
.container { max-width: 1180px; margin: 0 auto; padding: 0 2.5rem; position: relative; z-index: 1; }
section { padding: 7.5rem 0; position: relative; }
main > section:first-child { padding-top: calc(var(--nav-h) + 5rem); }

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 2000;
  background: var(--ink); color: var(--bg); padding: .75rem 1.25rem;
  font-size: .8rem; letter-spacing: .12em; text-decoration: none;
}
.skip-link:focus { left: 1rem; top: 1rem; }

/* ===== Navigation ===== */
.site-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--nav-h);
  display: flex; align-items: center;
  border-bottom: 1px solid transparent;
  transition: background .45s var(--ease), border-color .45s var(--ease), backdrop-filter .45s;
}
.site-nav.scrolled {
  background: rgba(251,250,248,.82);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-bottom-color: var(--line);
}
.nav-inner {
  width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 2.5rem;
  display: flex; align-items: center; justify-content: space-between; gap: 2rem;
}
.brand { display: flex; align-items: center; gap: .85rem; }
.brand-mark {
  width: 40px; height: 40px; flex: 0 0 auto;
  display: grid; place-items: center;
  background: var(--white);
  border: 1px solid var(--line); border-radius: 3px;
  font-family: var(--serif); font-size: 1.15rem; font-weight: 500;
  color: var(--gold); letter-spacing: .02em;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-text strong {
  font-size: .95rem; font-weight: 500; letter-spacing: .07em; color: var(--ink);
}
.brand-text em {
  font-style: normal; font-size: .64rem; letter-spacing: .2em;
  color: var(--faint); text-transform: uppercase;
}
.nav-cta {
  padding: .7rem 1.5rem;
  background: var(--ink); color: var(--bg);
  font-size: .74rem; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase;
  text-decoration: none; border-radius: 2px;
  transition: background .3s var(--ease), transform .3s var(--ease), box-shadow .3s var(--ease);
}
.nav-cta:hover { background: #000; transform: translateY(-1px); box-shadow: var(--shadow-sm); }

/* ===== Section header ===== */
.section-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 23rem);
  gap: 3rem; align-items: end;
  padding-bottom: 2.6rem;
  border-bottom: 1px solid var(--line);
  margin-bottom: 4rem;
}
.section-head .eyebrow { margin-bottom: 1.4rem; }
.section-head .section-note { color: var(--muted); font-weight: 300; font-size: .95rem; line-height: 1.9; }

/* ===== Project index list ===== */
.project-row {
  position: relative;
  display: grid;
  grid-template-columns: 4.5rem minmax(0, 1fr) auto;
  align-items: center;
  gap: 2.5rem;
  padding: 2.4rem 1.6rem 2.4rem 1.25rem;
  border-bottom: 1px solid var(--line);
  text-decoration: none; color: inherit;
  transition: background .5s var(--ease), padding-left .5s var(--ease);
}
.project-row:hover { background: var(--white); padding-left: 1.75rem; }
.row-index {
  font-family: var(--serif); font-size: 1.5rem; font-weight: 300; line-height: 1;
  color: var(--gold-soft); letter-spacing: .05em;
  transition: color .5s var(--ease);
}
.project-row:hover .row-index { color: var(--gold); }
.row-title {
  display: flex; align-items: center; gap: .9rem;
  font-family: var(--serif); font-size: 1.6rem; font-weight: 500;
  letter-spacing: .01em; color: var(--ink);
  margin-bottom: .6rem;
}
.row-icon {
  width: 34px; height: 34px; flex: 0 0 auto;
  display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 50%;
  color: var(--ink-soft);
  transition: color .5s var(--ease), border-color .5s var(--ease);
}
.project-row:hover .row-icon { color: var(--gold); border-color: var(--gold-soft); }
.row-desc { color: var(--muted); font-weight: 300; font-size: .92rem; line-height: 1.9; max-width: 46rem; }
.row-meta { display: flex; align-items: center; gap: 2.2rem; }
.row-tag {
  font-size: .68rem; font-weight: 500;
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--faint); white-space: nowrap;
}
.row-arrow {
  display: inline-flex; align-items: center; gap: .5rem;
  font-size: .68rem; font-weight: 500;
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--faint); white-space: nowrap;
  transition: color .45s var(--ease), transform .45s var(--ease);
}
.project-row:hover .row-arrow { color: var(--gold); transform: translateX(3px); }

/* ===== Footer ===== */
footer { border-top: 1px solid var(--line); padding: 2.75rem 0; position: relative; z-index: 1; }
.footer-inner {
  max-width: 1180px; margin: 0 auto; padding: 0 2.5rem;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 1.25rem;
}
.footer-text { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.footer-links { display: flex; gap: 2rem; }
.footer-links a {
  font-size: .74rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--faint); text-decoration: none;
  transition: color .3s var(--ease);
}
.footer-links a:hover { color: var(--ink); }

/* ===== Motion ===== */
.reveal { opacity: 0; transform: translateY(26px); transition: opacity .9s var(--ease), transform .9s var(--ease); }
.reveal.visible { opacity: 1; transform: none; }

/* ===== Responsive ===== */
@media (max-width: 1080px) {
  .section-head { grid-template-columns: 1fr; gap: 1.5rem; align-items: start; }
}
@media (max-width: 900px) {
  .site-nav { height: 68px; }
  main > section:first-child { padding-top: calc(var(--nav-h) + 4rem); }
  .container, .footer-inner, .nav-inner { padding: 0 1.5rem; }
}
@media (max-width: 768px) {
  section { padding: 4.5rem 0; }
  .section-head { margin-bottom: 3rem; }
  .project-row { grid-template-columns: 2.6rem minmax(0, 1fr); gap: 1rem 1.25rem; padding: 2rem 0; }
  .project-row:hover { padding-left: 0; }
  .row-meta { grid-column: 2; justify-content: space-between; gap: 1.5rem; }
  .row-title { font-size: 1.4rem; }
  .footer-inner { flex-direction: column; text-align: center; }
}
@media (max-width: 480px) {
  .container, .footer-inner, .nav-inner { padding: 0 1.2rem; }
  .brand-text em { display: none; }
  .row-tag { display: none; }
  .nav-cta { padding: .65rem 1.1rem; letter-spacing: .12em; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .reveal { opacity: 1; transform: none; }
}
</style>
</head>

<script>
/* ===== Navbar scroll state ===== */
(function () {
  var nav = document.getElementById('navbar');
  function onScroll() { nav.classList.toggle('scrolled', window.scrollY > 24); }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();

/* ===== Scroll reveal ===== */
(function () {
  var els = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) {
    els.forEach(function (el) { el.classList.add('visible'); });
    return;
  }
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
  els.forEach(function (el) { observer.observe(el); });
})();
</script>
